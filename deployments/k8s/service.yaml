apiVersion: v1
kind: Service
metadata:
  name: gobank-service
  namespace: banking
  labels:
    app: gobank
spec:
  type: ClusterIP
  selector:
    app: gobank
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP