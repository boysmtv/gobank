version: "3.9"

services:
  gobank:
    build:
      context: .
    env_file:
      - .env.example
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gobank
      POSTGRES_USER: gobank
      POSTGRES_PASSWORD: gobank
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
